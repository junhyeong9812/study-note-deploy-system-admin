# 무중단 배포용 전환 프록시 — 외부 포트를 받아 활성 자리(blue 또는 green)로 넘긴다.
# 이 파일은 원본이다. nginx 가 실제로 읽는 것은 ci-cd agent 가 전환 때 deploy/active/ 로 복사한 사본이다.
worker_processes 1;
worker_shutdown_timeout 30s;

events { worker_connections 1024; }

http {
    # 활성 자리: $deploy_slot 과 $deploy_upstream 을 정의한다. ci-cd agent 가 이 파일을 바꾸고 reload 한다.
    include /etc/nginx/upstream.conf;
    # 엣지 IP: $from_edge(엣지에서 온 연결이면 1)를 정의한다. 서버에만 있다(edge-allow.conf.example 참고).
    include /etc/nginx/edge-allow.conf;

    # --- 통신 규약 v1 — docs/cross-cutting/plans/2026-11-25/traffic-map/communication-protocol.md
    # 연결 주소는 아래 판정에만 쓴다. 접속 기록에는 싣지 않는다. set_real_ip_from 을 두지 않는다(1.3).
    geo $from_private {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
        fe80::/10      1;
    }
    # $from_edge 는 위의 include /etc/nginx/edge-allow.conf 가 정한다.

    # 요청 ID: 사설 대역(엣지 아님)에서 온 꼴 맞는 값만 받고, 아니면 nginx 가 만든다(1.3).
    map "$from_edge$from_private:$http_x_request_id" $protocol_request_id {
        "~^01:(?<incoming_request_id>[A-Za-z0-9_-]{1,64})$" $incoming_request_id;
        default                                              $request_id;
    }

    # 호출자: 엣지 연결은 edge, 사설 대역의 아는 이름은 그 이름, 나머지는 outside(2.2).
    map "$from_edge$from_private:$http_x_caller_service" $protocol_caller {
        "01:front"       front;
        "01:backend"     backend;
        "01:llm-wrapper" llm-wrapper;
        "01:alert"       alert;
        "01:observe"     observe;
        "01:admin"       admin;
        "01:ci-master"   ci-master;
        "01:ci-agent"    ci-agent;
        "~^1"            edge;
        default          outside;
    }

    # 경로: 첫 ? 앞의 1024자까지(3.2).
    map $request_uri $protocol_path {
        "~^(?<request_path_head>[^?]{0,1024})" $request_path_head;
        default                                 "";
    }
    map $request_uri $protocol_path_truncated {
        "~^[^?]{1025}" true;
        default        false;
    }

    # 접속 기록: 표준 출력에 JSON 한 줄. 주소 · 쿼리 · 리퍼러 · User-Agent · 쿠키 · 인증 머리글은 싣지 않는다(3.5).
    log_format protocol_v1 escape=json
        '{"v":1,"ts":$msec,"request_id":"$protocol_request_id","caller":"$protocol_caller",'
        '"service":"admin","method":"$request_method","path":"$protocol_path",'
        '"path_truncated":$protocol_path_truncated,"status":$status,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
        '"slot":"$deploy_slot","bytes_sent":$body_bytes_sent}';
    access_log /dev/stdout protocol_v1;

    # 엣지도 사설 대역도 아니면 닫는다(집 쪽 포트는 인터넷에서 직접 닿을 수 있다)
    map "$from_edge:$from_private" $connection_allowed {
        "0:0"   0;
        default 1;
    }

    # 앱이 읽는 클라이언트 IP 는 이 한 값뿐이다: 엣지에서 온 연결이면 엣지가 넣은 X-Real-IP, 아니면 실제 접속 주소.
    # 엣지가 아닌 곳에서 보낸 X-Real-IP · X-Forwarded-For 는 버려진다.
    map $from_edge $client_real_ip {
        1       $http_x_real_ip;
        default $remote_addr;
    }

    # 앱 주소를 요청 때마다 도커 내부 DNS 로 찾는다(5초 캐시) — 앱 재시작·미기동에도 nginx 가 버틴다.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server_tokens off;

    server {
        listen 18000;
        # 지금 어느 자리가 응답했는지 — agent 가 전환이 실제로 적용됐는지 이 값으로 판정한다
        add_header X-Deploy-Slot $deploy_slot always;
        add_header X-Request-Id $protocol_request_id always;   # 요청 ID 를 응답에 돌려준다(1.2)
        client_max_body_size 16k;

        if ($connection_allowed = 0) {
            return 444;   # 응답 없이 연결을 닫는다
        }

        # 아래 location 들이 같이 쓰는 프록시 설정(location 에서 proxy_set_header 를 다시 쓰지 않으므로 그대로 물려받는다)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-Id     $protocol_request_id;   # 앱은 nginx 가 정한 값만 받는다(1.3)
        proxy_set_header X-Caller-Service $protocol_caller;
        proxy_hide_header X-Request-Id;                           # 앱이 낸 값과 겹치지 않게
        # 앱이 낸 절대 Location(로그인 이동 — 기준은 ADMIN_ORIGIN)을 상대 주소로 바꾼다: 바깥에는 `/login` 만 나간다
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        absolute_redirect off;   # 위에서 만든 상대 주소를 nginx 가 다시 절대 주소(내부 포트 포함)로 바꾸지 않게
        proxy_connect_timeout 5s;
        # 로그인 한 건의 최대: 본문 3초(앱 기한) + 관측 판정 5초(첫 호출과 재시도를 합친 기한) + 잠금 알림 대기 2초 ≈ 10초.
        # 넉넉히 30초 — 이보다 오래 걸리면 앱 쪽 결함이다.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 로그인 요청(세부 4): 본문을 모으지 않고 앱으로 흘려보낸다(proxy_request_buffering off) — 앱이 읽으면서
        # 4KB 상한과 전체 3초 기한을 건다(넘으면 400 malformed 로 기록되고 속도 제한에도 든다). 앱은 그 전에 Origin 검사와
        # 속도 제한을 먼저 하므로 틀린 Origin · 제한 초과는 본문을 기다리지 않고 바로 답한다.
        # nginx 가 맡는 것은 둘뿐: 8KB 상한(넘으면 413 — 앱에 닿지 않는다)과 client_body_timeout(두 번의 읽기 사이 간격이지
        # 전체 기한이 아니다 — 2초 간격으로 계속 보내면 이것만으로는 끊기지 않는다). 흘려보내려면 HTTP/1.1 이 필요하다(위 proxy_http_version).
        location = /api/auth/login {
            client_max_body_size 8k;
            client_body_timeout 10s;
            proxy_request_buffering off;
            proxy_pass http://$deploy_upstream;
        }

        # 분석 요청(문제 화면 — 미리본 글 그대로를 폼으로 보낸다): 6만 자의 글을 퍼센트 인코딩하면 수백 KB — 앱의 본문 상한(1MB)과 같게 받는다.
        # 위 단계의 proxy_set_header · add_header 를 물려받게 여기서 다시 쓰지 않는다.
        location = /api/incidents/analysis {
            client_max_body_size 1m;
            proxy_pass http://$deploy_upstream;
        }

        location / {
            proxy_pass http://$deploy_upstream;
        }
    }
}
