# 무중단 배포용 전환 프록시 — 외부 포트를 받아 활성 자리(blue 또는 green)로 넘긴다.
# 이 파일은 원본이다. nginx 가 실제로 읽는 것은 ci-cd agent 가 전환 때 deploy/active/ 로 복사한 사본이다.
worker_processes 1;
worker_shutdown_timeout 30s;

events { worker_connections 1024; }

http {
    # 활성 자리: $deploy_slot 과 $deploy_upstream 을 정의한다. ci-cd agent 가 이 파일을 바꾸고 reload 한다.
    include /etc/nginx/upstream.conf;
    # 엣지 IP: $from_edge(엣지에서 온 연결이면 1)를 정의한다. 서버에만 있다(edge-allow.conf.example 참고).
    include /etc/nginx/edge-allow.conf;

    # 사설 대역·루프백에서 온 연결(서버 내부 확인 · agent 헬스 · 알림 서버 감시 · 도커 브리지)
    geo $from_private {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
    }

    # 엣지도 사설 대역도 아니면 닫는다(집 쪽 포트는 인터넷에서 직접 닿을 수 있다)
    map "$from_edge:$from_private" $connection_allowed {
        "0:0"   0;
        default 1;
    }

    # 앱이 읽는 클라이언트 IP 는 이 한 값뿐이다: 엣지에서 온 연결이면 엣지가 넣은 X-Real-IP, 아니면 실제 접속 주소.
    # 엣지가 아닌 곳에서 보낸 X-Real-IP · X-Forwarded-For 는 버려진다.
    map $from_edge $client_real_ip {
        1       $http_x_real_ip;
        default $remote_addr;
    }

    # 앱 주소를 요청 때마다 도커 내부 DNS 로 찾는다(5초 캐시) — 앱 재시작·미기동에도 nginx 가 버틴다.
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log off;   # 접속 IP 는 관측 서버의 로그인 시도 기록에만 남긴다
    server_tokens off;

    server {
        listen 18000;
        # 지금 어느 자리가 응답했는지 — agent 가 전환이 실제로 적용됐는지 이 값으로 판정한다
        add_header X-Deploy-Slot $deploy_slot always;
        client_max_body_size 16k;

        if ($connection_allowed = 0) {
            return 444;   # 응답 없이 연결을 닫는다
        }

        # 아래 location 들이 같이 쓰는 프록시 설정(location 에서 proxy_set_header 를 다시 쓰지 않으므로 그대로 물려받는다)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-Id $request_id;
        # 앱이 낸 절대 Location(로그인 이동 — 기준은 ADMIN_ORIGIN)을 상대 주소로 바꾼다: 바깥에는 `/login` 만 나간다
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        absolute_redirect off;   # 위에서 만든 상대 주소를 nginx 가 다시 절대 주소(내부 포트 포함)로 바꾸지 않게
        proxy_connect_timeout 5s;
        # 로그인 한 건의 최대: 본문 3초(앱 기한) + 관측 판정 5초(첫 호출과 재시도를 합친 기한) + 잠금 알림 대기 2초 ≈ 10초.
        # 넉넉히 30초 — 이보다 오래 걸리면 앱 쪽 결함이다.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 로그인 요청: 본문은 nginx 가 다 받은 뒤(기본 proxy_request_buffering on) 앱에 한 번에 넘긴다.
        # 그래서 느린 클라이언트는 nginx 에서 기다리고(client_body_timeout — 두 번의 읽기 사이 간격), 앱의 3초 기한은
        # nginx 를 거치지 않은 연결(자리 포트 직접)에서만 실제로 걸린다. 상한은 앱(4KB)보다 조금 크게 둬서
        # 4KB~8KB 는 앱이 형식 오류(malformed)로 기록하고, 그보다 큰 본문은 nginx 가 413 으로 끊는다(기록 없음).
        location = /api/auth/login {
            client_max_body_size 8k;
            client_body_timeout 3s;
            proxy_pass http://$deploy_upstream;
        }

        location / {
            proxy_pass http://$deploy_upstream;
        }
    }
}
