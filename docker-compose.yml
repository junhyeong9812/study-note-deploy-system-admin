# 무중단 배포: 앱은 두 자리(blue·green)로 뜨고 nginx 가 그중 하나로 보낸다. 평소에는 한 자리만 떠 있다.
# 전환은 ci-cd agent 가 한다(deploy/active/ 갱신 → nginx reload). 수동 조작은 ci-cd README 참고.
# 값은 전부 서버의 .env 에서 온다(저장소에 비밀값·IP 를 적지 않는다). 필수 설정이 없거나 형식이 틀리면 서버가 뜨지 않는다(종료 코드 78, 키 이름만 로그 1줄 — README "환경 변수").
x-admin: &admin
  build: .
  image: admin-app:${IMAGE_TAG:-local}   # ci-cd: CI 가 커밋 태그로 빌드, CD 가 그 태그로 교체
  environment:
    ADMIN_USER: ${ADMIN_USER:-}
    ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    SESSION_SECRET: ${SESSION_SECRET:-}            # 두 자리가 같은 값 — 전환 중에도 세션 유지
    ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
    OBSERVE_URL: ${OBSERVE_URL:-}
    OBSERVE_SECRET: ${OBSERVE_SECRET:-}
    ALERT_URL: ${ALERT_URL:-}
    ALERT_SECRET: ${ALERT_SECRET:-}
    DEPLOY_MASTER_URL: ${DEPLOY_MASTER_URL:-}      # 배포 이력 · 상태 화면(필수)
    DEPLOY_SECRET: ${DEPLOY_SECRET:-}
    BACKEND_URL: ${BACKEND_URL:-}
    LLM_URL: ${LLM_URL:-}                          # 통신 지도의 의존의 선(llm) — 선택
    LOG_REDIS_URL: ${LOG_REDIS_URL:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}               # 배포 상세(GitHub 읽기) — 선택
    SITE_ORIGIN: ${SITE_ORIGIN:-}                 # 방문 기록(경로 링크 · 자기 사이트 빼기) — 선택
    CLAUDE_RUNNER_URL: ${CLAUDE_RUNNER_URL:-}     # Claude 사용량 화면 — 선택
    CLAUDE_RUNNER_SETTINGS_SECRET: ${CLAUDE_RUNNER_SETTINGS_SECRET:-}
    CLAUDE_RUNNER_SECRET: ${CLAUDE_RUNNER_SECRET:-}  # 문제 화면의 분석(실행 자리 호출) — 선택
    OWNER_COOKIE_SECRET: ${OWNER_COOKIE_SECRET:-}    # 주인 표시(backend 와 같은 열쇠) — 선택
    OWNER_COOKIE_DOMAIN: ${OWNER_COOKIE_DOMAIN:-}
    SERVER_NAME: admin
  healthcheck:
    # localhost 금지 — 컨테이너 안에서 ::1로 풀리는 함정 (규약)
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18000/api/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
  restart: unless-stopped
  stop_grace_period: 30s

services:
  admin-blue:
    <<: *admin
    profiles: ["blue"]           # 이름을 지정해야만 뜬다 — `docker compose up -d` 가 두 자리를 한꺼번에 띄우지 않게
    container_name: admin-app-blue
    ports:
      - "127.0.0.1:18001:18000"    # agent 의 자리별 헬스 확인용 — 외부에는 nginx 만 열린다
  admin-green:
    <<: *admin
    profiles: ["green"]
    container_name: admin-app-green
    ports:
      - "127.0.0.1:18002:18000"

  nginx:
    image: nginx:1.27-alpine
    container_name: admin-nginx
    ports:
      - "${BIND_ADDR:?set BIND_ADDR in .env}:${PUBLIC_PORT:-18000}:18000"   # 엣지가 이 포트로 프록시. nginx 가 엣지 IP·사설 대역만 받는다
    volumes:
      # nginx 는 git 밖의 활성 디렉토리만 읽는다(서버에만 있다): nginx.conf(본 설정 사본) + upstream.conf(활성 자리)
      # + edge-allow.conf(엣지 IP — 저장소에 적지 않는다, deploy/nginx/edge-allow.conf.example 참고. 없으면 nginx 가 뜨지 않는다).
      - ./deploy/active:/etc/nginx:ro
    restart: unless-stopped
    logging:   # 접속 기록(통신 규약 v1)이 표준 출력으로 가므로 크기를 묶는다 — 에이전트는 json-file 을 도커 API 로 읽는다
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
